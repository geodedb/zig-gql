---
# GitLab CI/CD Pipeline for gql
# SPDX-License-Identifier: Apache-2.0

default:
  tags:
    - company
    # All jobs here run bash scripts under debian images; without an explicit
    # linux tag a hosted Windows shell runner matching `company` can pick
    # them up and fail on PowerShell (observed on pipeline #2657008316).
    - linux

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.43.0

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.43.0

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.43.0

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.43.0
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.43.0

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Pre-populate the zig package cache with the private `ebnf` dependency.
#
# WHY: `build.zig`'s "test" step (see `test_step.dependOn(&run_gf.step)`)
# and its "test-grammar" step both reach `b.lazyDependency("ebnf", ...)`
# (grammar/ + tests/grammar_test.zig + tests/grammar_fuzz.zig, added in
# B2/B6) -- but ONLY when `-Dgrammar=true` is passed; that dependency call
# lives inside build.zig's `if (with_grammar)` block precisely so that an
# unguarded `zig build` (any step, any job) never reaches it. Unlike the
# public `otel`/`thread-pool` deps, `ebnf` is a PRIVATE GitLab project
# (gitlab.com/devnw/zig/ebnf) -- an anonymous HTTPS GET against it
# 302-redirects to a sign-in page, so `zig build` cannot resolve the
# dependency over the network with no credentials. Only jobs that pass
# `-Dgrammar=true` (currently `test`, `grammar-verify`, `fuzz`) need this
# preamble; every other job omits both the flag and the preamble.
#
# HOW: clone the tagged ref with the job's own CI_JOB_TOKEN (works because
# the ebnf project's CI/CD job-token inbound allowlist includes this
# project -- see docs/GRAMMAR_VERIFICATION.md's "CI prerequisite" section),
# then run `zig fetch` against the local clone. `zig fetch` stores the
# package in the global cache keyed by content hash
# (`ebnf-0.2.1-rCUW9PB7AwBS6QjNDMRWrRHUUTkP26sAMN4MK59i3jw5`, matching
# build.zig.zon), so the subsequent `zig build` step resolves it from cache
# with no further network access -- it does not matter that the clone URL
# differs from the git+https URL in build.zig.zon.
.fetch-ebnf: &fetch-ebnf
  # debian:bookworm-slim ships without git (install-zig only adds curl/xz).
  - apt-get install -y --no-install-recommends git
  - git clone --depth 1 --branch v0.2.1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/devnw/zig/ebnf.git" /tmp/ebnf-dep
  - zig fetch /tmp/ebnf-dep

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check

# Unit tests
# `zig build test -Dgrammar=true` reaches the grammar-fuzz test artifact
# (tests/grammar_fuzz.zig, see build.zig's `test_step.dependOn(&run_gf.step)`,
# itself inside the `if (with_grammar)` block), which needs the private
# `ebnf` dependency -- hence -Dgrammar=true plus *fetch-ebnf.
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
    - *fetch-ebnf
  script:
    - zig build test -Dgrammar=true --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
# Deliberately does NOT pass -Dgrammar=true: grammar coverage across
# optimization levels is out of scope (grammar-verify is the single source of
# truth for grammar checks), so this never reaches `b.lazyDependency("ebnf",
# ...)` and needs no *fetch-ebnf preamble.
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
# Same reasoning as test-release-safe above: no -Dgrammar=true, no *fetch-ebnf.
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSafe --summary all
  needs:
    - build

test-integration-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
# Same reasoning as test-release-safe above: no -Dgrammar=true, no *fetch-ebnf.
test-release-small:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Grammar verification tests (ISO/IEC 39075 BNF conformance: smoke, geode
# merge-validate, keyword drift, conformance corpus, generation ratchet, plus
# the grammar-guided fuzz smoke loop -- see docs/GRAMMAR_VERIFICATION.md).
# Needs -Dgrammar=true (without it, `test-grammar` is a documented no-op) and
# *fetch-ebnf for the same reason as the `test` job above.
grammar-verify:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
    - *fetch-ebnf
  script:
    - zig build test-grammar -Dgrammar=true --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
# `zig build test --fuzz` also compiles/runs the grammar-fuzz test artifact
# (tests/grammar_fuzz.zig), same as the `test` job above -- needs
# -Dgrammar=true plus *fetch-ebnf.
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
    - *fetch-ebnf
  script:
    - timeout 60 zig build test -Dgrammar=true --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build
